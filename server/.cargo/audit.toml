# cargo-audit settings for the server crate.
[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa, Marvin timing attack; no patched release exists).
    # `rsa` appears in Cargo.lock only because sqlx lists its MySQL driver as an
    # optional dependency. We enable only the Postgres driver, so `rsa` is never
    # compiled: `cargo tree -i rsa --target all -e all` prints nothing.
    # Revisit if a MySQL driver or any RSA usage is ever added.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0459 (libsqlite3-sys, bundled SQLite before 3.54.0 can return
    # uninitialised memory from a crafted database and -wal file pair).
    # `libsqlite3-sys` appears in Cargo.lock only because sqlx lists its SQLite
    # driver as an optional dependency, and sqlx 0.8 pins the affected version.
    # We enable only the Postgres driver, so it is never compiled:
    # `cargo tree -i libsqlite3-sys --target all -e all` prints nothing.
    # Drop this entry when sqlx is upgraded to a release that pulls
    # libsqlite3-sys 0.39 or later; revisit at once if a SQLite driver is added.
    "RUSTSEC-2026-0459",
]
