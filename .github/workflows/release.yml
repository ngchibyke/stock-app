# Builds, signs and (optionally) uploads the app. Started by hand from the Actions tab.
#
# NEVER RUN YET. It needs the secrets listed in docs/release/release-howto.md, and the iOS job
# needs an Apple Developer account. Each job stops at once, naming the secret that is missing.
# Nothing here uploads unless "upload" is ticked AND that store's secret exists.
name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, for example 1.0.0'
        required: true
        type: string
      api_base_url:
        description: 'Production API address (https://...)'
        required: true
        type: string
      upload:
        description: 'Upload to Play internal testing and TestFlight (when their secrets exist)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: The production address must be https
        env:
          API: ${{ inputs.api_base_url }}
        run: |
          case "$API" in
            https://*) ;;
            *) echo "::error::api_base_url must start with https://"; exit 1 ;;
          esac
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart run tool/apply_brand.dart --check
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (AAB)
    needs: checks
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: app
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: The signing secrets must exist
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::missing secret $v"; missing=1; fi
          done
          exit $missing
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Write the upload key (outside the checkout)
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Write the Firebase file, if there is one
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON: the build has no push."
          fi
      - name: Build the signed bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
        run: >
          flutter build appbundle --release
          --dart-define=API_BASE_URL=${{ inputs.api_base_url }}
          --build-name=${{ inputs.version_name }}
          --build-number=${{ github.run_number }}
      - name: The bundle must be signed with the upload key, not the debug key
        run: |
          out=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab)
          echo "$out" | grep -E "Owner:|SHA256:" | head -3
          if echo "$out" | grep -q "Android Debug"; then
            echo "::error::the bundle is signed with the debug key"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: The application id, for the upload
        id: brand
        run: echo "id=$(python3 -c "import json;print(json.load(open('brand.json'))['application_id'])")" >> "$GITHUB_OUTPUT"
      - name: Upload to Play internal testing
        if: ${{ inputs.upload && env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.brand.outputs.id }}
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          # A draft until the first release is published once by hand in the Play Console.
          status: draft
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/app/google-services.json

  ios:
    name: iOS (IPA)
    needs: checks
    runs-on: macos-latest
    environment: release
    defaults:
      run:
        working-directory: app
    env:
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: The signing secrets must exist
        run: |
          missing=0
          for v in IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROFILE_BASE64 IOS_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::missing secret $v"; missing=1; fi
          done
          exit $missing
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Install the certificate and the provisioning profile
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Write the Firebase file, if there is one
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          else
            echo "No GOOGLE_SERVICE_INFO_PLIST: the build has no push."
          fi
      - name: Build
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=${{ inputs.api_base_url }}
          --build-name=${{ inputs.version_name }}
          --build-number=${{ github.run_number }}
      - name: Archive and export, signed, with the push entitlement
        run: |
          set -e
          BUNDLE_ID=$(python3 -c "import json;print(json.load(open('brand.json'))['bundle_id'])")
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_ENTITLEMENTS=Runner/Release.entitlements \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
      - name: Upload to TestFlight
        if: ${{ inputs.upload && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != '' }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove the keys
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/app.mobileprovision" ios/Runner/GoogleService-Info.plist
          rm -rf "$HOME/.appstoreconnect"
